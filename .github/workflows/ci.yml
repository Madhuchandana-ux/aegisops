name: AegisOps CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:
    name: Run AegisOps Tests
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------
      # ENVIRONMENT
      # ------------------------------------------------------

      - name: Create CI environment file
        shell: bash
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=sqlite:///./aegisops.db
          REDIS_URL=redis://localhost:6379/0
          LLM_PROVIDER=mock
          LLM_MODEL=local-development
          JWT_SECRET=ci-test-secret-change-me-to-a-long-random-value-2026
          SERVICENOW_MODE=mock
          EOF

      # ------------------------------------------------------
      # TESTS
      # ------------------------------------------------------

      - name: Run test suite
        run: pytest -q